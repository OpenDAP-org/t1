<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T1 devices and sync screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<style>
/* Values from ui-components/tokens/opendap.tokens.json (Engineered Matter). */
:root{
  --bg:#111315; --surface:#191C1F; --raised:#202428; --active:#292E33; --sep:#3A4148;
  --g500:#737C85; --text:#F5F6F4; --text2:#C6CBD0; --muted:#939BA3; --on-brand:#111315;
  --brand:#FF6A2A; --brand-pressed:#C84719; --focus:#FF874D;
  --success:#64D6A1; --warning:#F3C66B; --error:#FF5D65; --info:#69BFFF; --processing:#A995FF;
  --border:#343A40; --border-strong:#515A63;
  --r-control:10px; --r-card:16px; --r-panel:20px; --r-pill:999px;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --page:#0B0C0E; --page-text:#C6CBD0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--page-text);font-family:var(--sans);padding:40px 24px 64px}
header{max-width:1440px;margin:0 auto 32px}
header h1{font-size:24px;line-height:30px;font-weight:600;color:var(--text)}
header p{font-size:14px;line-height:20px;color:var(--muted);margin-top:6px;max-width:820px}
.grid{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:40px 32px;justify-items:center}
figure{width:320px}
figcaption{margin-top:12px;font-size:12px;line-height:16px;color:var(--muted)}
figcaption b{display:block;color:var(--text2);font-weight:500;font-size:14px;line-height:20px;margin-bottom:2px}
/* The panel: 320 x 480 px, one CSS px per panel px. */
.screen{width:320px;height:480px;background:var(--bg);color:var(--text);position:relative;overflow:hidden;border-radius:4px;outline:1px solid #22262A}
.sb{height:28px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text2)}
.sb .l,.sb .r{display:flex;align-items:center;gap:7px}
.sb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.vol{color:var(--success)}
.top{height:52px;display:flex;align-items:center;padding:0 8px;gap:4px}
.top h2{font-size:20px;line-height:26px;font-weight:600}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:var(--r-control);color:var(--text)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.content{padding:0 24px}
.label{font-size:12px;line-height:16px;color:var(--muted);margin:16px 0 8px}
.card{background:var(--surface);border-radius:var(--r-card)}
.row{min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 16px}
.row+.row{border-top:1px solid var(--border)}
.row .ic{width:24px;height:24px;flex:none;color:var(--text2)}
.row .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex:1;min-width:0}
.row .t1{font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.state{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{height:52px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;line-height:22px}
.btn.primary{background:var(--brand);color:var(--on-brand);height:64px}
.btn.secondary{background:var(--active);color:var(--text);font-weight:500}
.btn.ghost{color:var(--text2);font-weight:500}
.mono{font-family:var(--mono)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-radius:var(--r-panel) var(--r-panel) 0 0;padding:8px 0 16px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 8px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.selected{background:var(--active)}
.tick{color:var(--text)}
.bar{height:12px;border-radius:6px;overflow:hidden;display:flex;gap:2px;background:var(--active)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px;font-size:12px;line-height:16px;color:var(--text2)}
.legend span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
.np-art{width:224px;height:224px;margin:8px auto 0;border-radius:var(--r-card);background:linear-gradient(160deg,#3A4148,#191C1F 70%);display:grid;place-items:center;color:var(--g500)}
.transport{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:16px}
.pp{width:64px;height:64px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--on-brand)}
.pp svg{width:28px;height:28px;fill:currentColor;stroke:none}
.sk{width:52px;height:52px;display:grid;place-items:center;color:var(--text)}
.sk svg{width:26px;height:26px;fill:currentColor}
.toast{position:absolute;left:12px;right:12px;bottom:12px;background:var(--active);border-radius:var(--r-control);height:52px;display:flex;align-items:center;padding:0 8px 0 16px;font-size:14px;line-height:20px}
.toast .u{margin-left:auto;height:48px;padding:0 12px;display:flex;align-items:center;color:var(--focus);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Devices and sync on the T1</h1>
  <p>Screens of the <a style="color:var(--focus)" href="../../docs/specs/devices-and-sync-ui.md">devices and sync UI spec</a>, at the panel's real size (320 × 480, one CSS pixel per panel pixel), in the Engineered Matter tokens. Draft, 2026-10-23: layouts to confirm on the virtual T1. Content is illustrative.</p>
</header>
<main class="grid" id="grid"></main>

<template id="statusbar">
  <div class="sb">
    <div class="l"><span>10:42</span>
      <svg viewBox="0 0 14 14" aria-label="microSD card"><path d="M4 1.5h5l2.5 2.5v8.5h-7.5z"/><path d="M6 1.5v2M8 1.5v2"/></svg>
      <span class="vol state" aria-label="Volume 38 of 100"><svg viewBox="0 0 14 14"><path d="M2 5.5h2.5L8 2.5v9L4.5 8.5H2z"/><path d="M10 5a3 3 0 0 1 0 4"/></svg>38</span>
    </div>
    <div class="r">
      <svg viewBox="0 0 14 14" aria-label="Bluetooth"><path d="M4 4l6 5-3 3V2l3 3-6 5"/></svg>
      <svg viewBox="0 0 14 14" aria-label="Wi-Fi"><path d="M1.5 5.5a8 8 0 0 1 11 0M3.5 7.8a5 5 0 0 1 7 0M5.6 10a2 2 0 0 1 2.8 0"/></svg>
      <span>82%</span>
      <svg viewBox="0 0 20 14" style="width:20px" aria-label="Battery 82 percent"><rect x="1" y="3" width="16" height="8" rx="2"/><rect x="3" y="5" width="11" height="4" rx="1" fill="currentColor" stroke="none"/><path d="M19 6v2"/></svg>
    </div>
  </div>
</template>

<script>
const I = {
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>',
  laptop:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
  dap:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10 18h4"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 5h2"/></svg>',
  head:'<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
  speaker:'<svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2"/><circle cx="12" cy="14" r="3.5"/><circle cx="12" cy="6.5" r="1"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sync:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14 5.3M4 12a8 8 0 0 1 14-5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  cross:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  usb:'<svg viewBox="0 0 24 24"><path d="M12 3v15"/><path d="M9 6l3-3 3 3"/><path d="M12 13l-4-2.5V8M12 15l4-2.5V10"/><circle cx="12" cy="19" r="2"/><rect x="7" y="6.5" width="2" height="2"/><circle cx="16" cy="9" r="1"/></svg>',
  devices:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="9" rx="1.5"/><path d="M1.5 17h15"/><rect x="17" y="8" width="5.5" height="11" rx="1.5"/></svg>',
  queue:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h10"/><path d="M18 14v6l3-3z" fill="currentColor"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
  update:'<svg viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 16v3.5h16V16"/></svg>',
  disc:'<svg viewBox="0 0 24 24" style="width:56px;height:56px"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>',
};
const prev='<svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>';
const next='<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>';
const play='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const pause='<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>';
const sb=()=>document.getElementById('statusbar').innerHTML;
const row=(ic,t1,t2,right='')=>`<div class="row"><span class="ic">${ic}</span><span class="t"><div class="t1">${t1}</div>${t2?`<div class="t2">${t2}</div>`:''}</span>${right}</div>`;
const topbar=(title,back=true)=>`<div class="top">${back?`<span class="ib" role="button" aria-label="Back">${I.back}</span>`:'<span style="width:16px"></span>'}<h2>${title}</h2></div>`;
const st=(c,t)=>`<span class="state" style="color:${c}">${t}</span>`;

const S = [];

S.push(['Quick settings: the sync line','Pulled down from the status bar (SYS-039). One line says the sync state in the conventions spec\'s words; tap for detail. The devices shortcut sits beside it.',`
${sb()}
<div class="content" style="padding-top:8px">
  <div class="card" style="padding:12px 16px">
    <div style="display:flex;gap:8px">
      ${[['Wi-Fi','On'],['Bluetooth','On'],['Profile','Direct']].map(([t,v])=>`<div role="button" style="flex:1;height:52px;border-radius:var(--r-control);background:var(--active);display:flex;flex-direction:column;justify-content:center;padding:0 10px;font-size:12px;line-height:16px;color:var(--text)">${t}<span style="color:var(--muted)">${v}</span></div>`).join('')}
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    ${row(`<span style="color:var(--success)">${I.check}</span>`,'Synced 2 min ago','MacBook · over USB',I.chev)}
    ${row(I.laptop.replace('<svg','<svg'),'Devices','3 paired',I.chev)}
  </div>
  <div class="label">Notifications</div>
  <div class="card">${row(I.update,'Update ready','Installs tonight while charging',I.chev)}</div>
</div>`]);

S.push(['Now Playing: where music plays','The devices button opens one list (Spotify Connect pattern). Choosing moves playback with its position and queue (SYS-042); the choice shows at once and settles when the other side confirms.',`
${sb()}
<div style="filter:brightness(.6)">
  <div class="top" style="justify-content:space-between"><span class="ib">${I.down}</span><span class="ib">${I.queue}</span></div>
  <div class="np-art">${I.disc}</div>
</div>
<div class="scrim" style="top:28px;background:rgba(0,0,0,.35)"></div>
<div class="sheet" role="dialog" aria-label="Play on">
  <div class="grab"></div>
  <div style="padding:0 24px 8px;font-size:16px;line-height:22px;font-weight:600">Play on</div>
  <div style="padding:0 12px">
    <div class="row selected" style="border-radius:var(--r-control)"><span class="ic tick">${I.dap}</span><span class="t"><div class="t1">This T1</div><div class="t2 mono">FLAC 24/96 · Bit-perfect</div></span><span class="ic" style="color:var(--text)">${I.check}</span></div>
    <div class="row" style="border:0"><span class="ic">${I.laptop}</span><span class="t"><div class="t1">MacBook</div><div class="t2">OpenDAP Desktop</div></span></div>
    <div class="row" style="border:0"><span class="ic">${I.head}</span><span class="t"><div class="t1">WH-1000XM5</div><div class="t2 mono">Bluetooth · LDAC 990 kbps</div></span></div>
    <div class="row" style="border:0"><span class="ic">${I.speaker}</span><span class="t"><div class="t1">Living room</div><div class="t2">Network renderer</div></span></div>
  </div>
</div>`]);

S.push(['Now Playing: playing elsewhere','Another of the owner\'s devices is playing. The T1 shows the live state, its buttons control that device, and "Play here" takes it over in one action.',`
${sb()}
<div class="top" style="justify-content:space-between"><span class="ib">${I.down}</span><span style="display:flex"><span class="ib" style="color:var(--info)">${I.devices}</span><span class="ib">${I.queue}</span></span></div>
<div class="np-art" style="width:152px;height:152px;margin-top:0">${I.disc}</div>
<div class="content" style="margin-top:10px;text-align:center">
  <div style="font-size:20px;line-height:26px;font-weight:600">You Only Live Once</div>
  <div style="font-size:14px;line-height:20px;color:var(--text2)">The Strokes</div>
  <div style="margin-top:6px;font-size:12px;line-height:16px;color:var(--info);display:inline-flex;gap:6px;align-items:center"><svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>Playing on MacBook</div>
</div>
<div class="transport" style="margin-top:8px"><span class="sk">${prev}</span><span class="pp" role="button" aria-label="Pause on MacBook">${pause}</span><span class="sk">${next}</span></div>
<div class="content" style="position:absolute;left:0;right:0;bottom:16px"><div class="btn secondary" role="button">Play here</div></div>`]);

S.push(['Pairing: the code','Settings → Devices → Pair a device. A QR code and a short code that expires (RFC 8628 shape); the other side scans or types it. The LED blinks blue fast.',`
${sb()}
${topbar('Pair a device')}
<div class="content" style="text-align:center">
  <div id="qr" style="width:168px;height:168px;margin:4px auto 0;background:var(--text);border-radius:12px;padding:10px"></div>
  <div class="mono" style="margin-top:16px;font-size:24px;line-height:30px;letter-spacing:.06em;color:var(--text)">K7QD-M2XP</div>
  <div style="margin-top:4px;font-size:12px;line-height:16px;color:var(--muted)">Shown as “Diana’s T1” · expires in <span class="mono">9:41</span></div>
  <div style="margin-top:12px;font-size:14px;line-height:20px;color:var(--text2)">Open OpenDAP Desktop and scan the code, or type it.</div>
</div>
<div class="content" style="position:absolute;left:0;right:0;bottom:16px"><div class="btn ghost" role="button">Cancel</div></div>`]);

S.push(['Pairing: confirm on the T1','The T1 shows who asks. Pairing is granted only here, with Pair as the primary action, also on the Action button.',`
${sb()}
${topbar('Pair a device')}
<div class="content" style="text-align:center;margin-top:32px">
  <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text2)"><span style="width:32px;height:32px;display:block">${I.laptop.replace('<svg','<svg style="width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.6"')}</span></div>
  <div style="margin-top:16px;font-size:20px;line-height:26px;font-weight:600">MacBook</div>
  <div style="font-size:14px;line-height:20px;color:var(--text2)">OpenDAP Desktop wants to pair</div>
  <div style="margin-top:16px;font-size:12px;line-height:16px;color:var(--muted)">It will sync your library and settings, and control playback. You can remove it anytime in Devices.</div>
</div>
<div class="content" style="position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;gap:16px">
  <div class="btn ghost" role="button">Cancel</div>
  <div class="btn primary" role="button">Pair</div>
</div>`]);

S.push(['Devices','Paired devices with last seen and sync state; tap one for links, permissions and Remove. Household members are opt-in (SYS-044). Bluetooth gear shows its codec while connected.',`
${sb()}
${topbar('Devices')}
<div class="content">
  <div class="card">${row(I.dap,'Diana’s T1','This device')}</div>
  <div class="label">Paired</div>
  <div class="card">
    ${row(I.laptop,'MacBook',`Last seen now · ${st('var(--success)','Synced')}`,I.chev)}
    ${row(I.dap,'Second T1',`Last seen 3 days ago · ${st('var(--muted)','Waiting')}`,I.chev)}
    ${row(I.phone,'Pair a device','QR code and short code',`<span class="ic" style="color:var(--text)">${I.plus}</span>`)}
  </div>
  <div class="label">Household</div>
  <div class="card">${row(I.people,'Members','Off · opt-in',I.chev)}</div>
</div>`]);

S.push(['Connected to a computer','With no OpenDAP client on the computer, the T1 hands over its music card (blackbird-os ADR 0013). Playback continues from the cache; Eject is the primary action, also on Action. The LED blinks blue slowly.',`
${sb()}
<div class="content" style="text-align:center;padding-top:56px">
  <div style="width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--info)">${I.usb.replace('<svg','<svg style="width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.6"')}</div>
  <div style="margin-top:16px;font-size:20px;line-height:26px;font-weight:600">Connected to a computer</div>
  <div style="margin-top:8px;font-size:14px;line-height:20px;color:var(--text2)">Your music card is in use by the computer. Eject it there, or here, before unplugging.</div>
  <div style="margin-top:16px;font-size:12px;line-height:16px;color:var(--muted)">Playing from the T1’s cache. Tracks not cached return after ejecting.</div>
</div>
<div class="content" style="position:absolute;left:0;right:0;bottom:16px"><div class="btn primary" role="button">Eject</div></div>`]);

S.push(['Sync detail','One screen: the state, recent activity grouped, a kept conflict reported once, and the next step for every failure. Sync now and Pause are always there.',`
${sb()}
${topbar('Sync')}
<div class="content">
  <div style="display:flex;align-items:center;gap:8px;color:var(--success)">${I.check.replace('<svg','<svg class="i"')}<span style="font-size:16px;line-height:22px;color:var(--text)">Synced 2 min ago</span></div>
  <div style="font-size:12px;line-height:16px;color:var(--muted);margin-left:32px">MacBook · over USB</div>
  <div class="card" style="margin-top:12px">
    ${row(`<span style="color:var(--success)">${I.check}</span>`,'24 tracks arrived','2 albums, 1 playlist')}
    ${row(`<span style="color:var(--error)">${I.cross}</span>`,'1 album couldn’t sync','Not enough space: <span class="mono">2.1 GB</span> needed')}
    ${row(`<span style="color:var(--warning)">${I.sync}</span>`,'“Running” edited twice','Both versions kept · choose later')}
  </div>
</div>
<div class="content" style="position:absolute;left:0;right:0;bottom:16px;display:flex;gap:2px">
  <div class="btn secondary" style="flex:1;border-radius:999px 0 0 999px" role="button">Pause</div>
  <div class="btn secondary" style="flex:1;border-radius:0 999px 999px 0" role="button">Sync now</div>
</div>`]);

S.push(['Storage and Recently Deleted','One bar by category, as on phones and computers. Deleted items wait 30 days on every device (SYS-050); quick removals show Undo.',`
${sb()}
${topbar('Storage')}
<div class="content">
